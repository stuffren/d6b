# GitHub Pages 部署工作流（子路径部署）
#
# 用途：代码推送到 main 分支时自动构建并部署到 GitHub Pages
# 访问地址：https://<owner>.github.io/<repo>/
#
# 环境隔离：此工作流注入 BASE_PATH=/<repo>/，与本地开发/预览环境完全隔离

name: Deploy to GitHub Pages

on:
  # 推送到 main 分支时自动触发
  push:
    branches: [main]

  # 支持手动触发
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        default: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEPLOY_ENV: gh-pages

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ github.event.inputs.node_version || '22' }}
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 解析部署地址（子路径由仓库名推导，零配置）
      - name: Resolve deploy target
        id: target
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "base_path=/${REPO}/" >> "$GITHUB_OUTPUT"
          echo "site_url=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "部署目标: BASE_PATH=/${REPO}/  SITE_BASE_URL=https://${OWNER}.github.io/${REPO}"

      # 5. 执行构建（注入子路径环境变量，覆盖 .env 与 presets）
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.target.outputs.base_path }}
          SITE_BASE_URL: ${{ steps.target.outputs.site_url }}

      # 6. 校验构建产物
      - name: Verify build output
        env:
          BASE_PATH: ${{ steps.target.outputs.base_path }}
          SITE_BASE_URL: ${{ steps.target.outputs.site_url }}
        run: |
          for f in index.html 404.html sitemap.xml robots.txt; do
            test -f "dist/$f" || { echo "缺少 dist/$f"; exit 1; }
          done
          test ! -f dist/CNAME || { echo "子路径部署不应生成 dist/CNAME"; exit 1; }
          grep -q "src=\"${BASE_PATH}assets/" dist/index.html || { echo "资源路径未带 BASE_PATH 前缀"; exit 1; }
          grep -q "rel=\"canonical\" href=\"${SITE_BASE_URL}/" dist/index.html || { echo "canonical 未使用 SITE_BASE_URL"; exit 1; }
          echo "产物校验通过"

      # 7. 部署到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true